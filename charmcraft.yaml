# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: phased-updater-operator
title: Phased Updater Operator
summary: A charm that deploys the Phased Updater application.
description: |
  The Phased Updater Operator is a Juju charm that deploys and manages the
  Phased Updater application, which allows for phased updates of Ubuntu
  packages.

  Phased Updates takes care of releasing Ubuntu Stable Updates in an incremental
  and controlled manner. This allows for early detection of potential issues and
  can halt the release of an update if a critical issue is detected, ensuring a
  more stable and reliable experience for users.

  This charm is used by Ubuntu Engineering to deploy the Phased Updater application on
  the Ubuntu infrastructure.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

parts:
  phased-updater-charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

  phased-updater-app:
    plugin: dump
    source: app
    organize:
      lputils.py: app/lputils.py
      phased-updater: app/phased-updater
      phased-updater.conf: app/phased-updater.conf
      run-phased-updater: app/run-phased-updater

config:
  options:
    launchpadlib_secret_id:
      type: secret
      description: A launchpadlib secrets file, to be used with lp.login_with(credentials_file=)
    dry_run:
      type: boolean
      default: false
      description: If true, phased-updates will run without making any phasing changes, but will still check all updates.
    send_email:
      type: boolean
      default: true
      description: If true, phased-updates will notify uploaders via email if their update is blocked by phasing.
    ignore_releases:
      type: list
      default: []
      description: A list of ubuntu releases to ignore when checking for phasing. Mostly used to make troubleshooting faster by reducing the number of releases to process and speed up a full run.
