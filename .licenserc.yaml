header:
  - license:
      spdx-id: GPL-3.0-only
      copyright-owner: Canonical Ltd.
      pattern: |
        Copyright \d{4} Canonical Ltd.
        See LICENSE file for licensing details.
    paths:
      - '**'
    paths-ignore:
      - '.github/**'
      - '**/.gitkeep'
      - '**/*.cfg'
      - '**/*.conf'
      - '**/*.ini'
      - '**/*.j2'
      - '**/*.json'
      - '**/*.md'
      - '**/*.rule'
      - '**/*.tmpl'
      - '**/*.txt'
      - '**/*.xml'
      - '.codespellignore'
      - '.dockerignore'
      - '.flake8'
      - '.jujuignore'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.trivyignore'
      - '.woke.yaml'
      - '.woke.yml'
      - 'CODEOWNERS'
      - 'icon.svg'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'trivy.yaml'
      - 'uv.lock'
      - 'zap_rules.tsv'
      - 'lib/**'
      - 'app/lputils.py'
      - 'app/phased-updater'
    comment: on-failure
  - license:
        spdx-id: GPL-3.0-only
        copyright-owner: Canonical Ltd.
        pattern: |
            Copyright \d{4} Canonical Ltd.
    paths:
      - 'app/lputils.py'
      - 'app/phased-updater'

